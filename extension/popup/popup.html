<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoKeep</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="wordmark">ChronoKeep</span>
    </header>

    <div class="toggle-row">
      <label class="toggle-switch" aria-label="Enable auto-archiving">
        <input type="checkbox" id="enableToggle">
        <span class="slider"></span>
      </label>
      <span id="statusText">Auto-archiving enabled</span>
    </div>

    <div class="history-wrap">
      <h2>Recent Archives</h2>
      <div id="historyList" class="history-list">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <footer>
      <button id="optionsBtn" class="btn">Options</button>
      <a href="https://web.archive.org/" target="_blank" rel="noopener" class="btn btn-ghost">Wayback Machine</a>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
